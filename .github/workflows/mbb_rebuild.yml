name: MBB Rebuild (RAPM -> Backfill -> Train)

# Manual, run once after switching to the ridge RAPM (and any time the RAPM or feature code changes).
# Order matters: backfill features read the PRIOR season's box-score player_rapm.csv.gz, and train reads the backfill.
# Stint RAPM (player_rapm_stint.csv.gz) is only for the app; ESPN only logs substitutions from 2025 on.

on:
  workflow_dispatch:
    inputs:
      first_season:
        description: "First season (ending year)"
        default: "2005"
      last_season:
        description: "Last season (ending year)"
        default: "2026"
      stint_first_season:
        description: "First season to run the stint RAPM (play-by-play subs; older seasons may not reconstruct)"
        default: "2025"

permissions:
  contents: write

concurrency:
  group: mbb-data
  cancel-in-progress: false

jobs:
  rapm:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::hoopR, any::dplyr, any::readr, any::Matrix, any::glmnet
          cache-version: 1
      - name: Clear old RAPM files
        run: rm -f data/mbb/*/player_rapm.csv.gz data/mbb/*/player_rapm_stint.csv.gz
      - name: Box-score RAPM, all seasons (the model's roster feature)
        run: Rscript mbb_rapm.R ${{ inputs.first_season }} ${{ inputs.last_season }}
      - name: Stint RAPM (the app's player value; 2025 on)
        run: Rscript mbb_rapm_stint.R ${{ inputs.stint_first_season }} ${{ inputs.last_season }}
      - name: Commit RAPM
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb
          git diff --cached --quiet || git commit -m "MBB ridge RAPM ${{ inputs.first_season }}-${{ inputs.last_season }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push

  backfill:
    needs: rapm
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4          # fresh checkout picks up the RAPM commit above
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::hoopR, any::dplyr, any::tidyr, any::readr, any::zoo, any::httr, any::jsonlite
          cache-version: 1
      - name: Rebuild features with prior-season RAPM
        run: Rscript mbb_backfill.R ${{ inputs.first_season }} ${{ inputs.last_season }}
      - name: Commit features
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb
          git diff --cached --quiet || git commit -m "MBB backfill (ridge RAPM) ${{ inputs.first_season }}-${{ inputs.last_season }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push

  train:
    needs: backfill
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::xgboost, any::dplyr, any::readr, any::jsonlite, any::Matrix, any::glmnet, any::hoopR, any::tidyr
          cache-version: 1
      - name: Train model
        run: Rscript mbb_train.R ${{ inputs.first_season }} ${{ inputs.last_season }}
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb_model
          git diff --cached --quiet || git commit -m "MBB model retrain $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
