name: MBB Rebuild (BPM -> Backfill -> RAPM + Train)

# Manual, run once after switching to box-score BPM (and any time the BPM or feature code changes).
# NOTE: later jobs check out ref: github.ref_name, because the default checkout is the trigger SHA and would miss earlier jobs' commits.
# Order matters: backfill features read the PRIOR season's player_bpm.csv.gz, and train reads the backfill.
# BPM only needs the existing games.csv.gz (ids, margin, possessions), so it can run first.
# RAPM (display only, not a model feature) needs BOTH the backfill's games.csv.gz and the BPM prior,
# so it runs after backfill, in parallel with train.

on:
  workflow_dispatch:
    inputs:
      first_season:
        description: "First season (ending year)"
        default: "2005"
      last_season:
        description: "Last season (ending year)"
        default: "2026"
      rapm_first_season:
        description: "First season for RAPM (needs play-by-play; each season is slow)"
        default: "2024"

permissions:
  contents: write

concurrency:
  group: mbb-data
  cancel-in-progress: false

jobs:
  bpm:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::hoopR, any::dplyr, any::readr, any::Matrix, any::glmnet
          cache-version: 1
      - name: Clear old rating files (BPM, and the retired RAPM / stint RAPM; RAPM is rebuilt in the rapm job)
        run: rm -f data/mbb/*/player_bpm.csv.gz data/mbb/*/player_rapm.csv.gz data/mbb/*/player_rapm_stint.csv.gz
      - name: Box-score BPM, all seasons (model roster feature + app player value)
        run: Rscript mbb_bpm.R ${{ inputs.first_season }} ${{ inputs.last_season }}
      - name: Commit BPM
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb
          git diff --cached --quiet || git commit -m "MBB box-score BPM ${{ inputs.first_season }}-${{ inputs.last_season }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push

  backfill:
    needs: bpm
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # ref = branch tip, NOT the trigger SHA, so this job sees the commit the previous job pushed
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::hoopR, any::dplyr, any::tidyr, any::readr, any::zoo, any::httr, any::jsonlite
          cache-version: 1
      - name: Rebuild features with prior-season BPM
        run: Rscript mbb_backfill.R ${{ inputs.first_season }} ${{ inputs.last_season }}
      - name: Commit features
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb
          git diff --cached --quiet || git commit -m "MBB backfill (BPM) ${{ inputs.first_season }}-${{ inputs.last_season }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push

  rapm:
    needs: backfill
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::hoopR, any::dplyr, any::readr, any::Matrix, any::glmnet
          cache-version: 1
      # A season with no usable play-by-play is skipped instead of failing the whole job
      - name: Prior-informed RAPM (display only)
        run: |
          for s in $(seq ${{ inputs.rapm_first_season }} ${{ inputs.last_season }}); do
            Rscript mbb_rapm.R $s || echo "::warning::RAPM failed for season $s"
          done
      - name: Commit RAPM
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb
          git diff --cached --quiet || git commit -m "MBB RAPM ${{ inputs.rapm_first_season }}-${{ inputs.last_season }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push

  train:
    needs: backfill
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::xgboost, any::dplyr, any::readr, any::jsonlite, any::Matrix, any::glmnet, any::hoopR, any::tidyr
          cache-version: 1
      - name: Train model
        run: Rscript mbb_train.R ${{ inputs.first_season }} ${{ inputs.last_season }}
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb_model
          git diff --cached --quiet || git commit -m "MBB model retrain $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
