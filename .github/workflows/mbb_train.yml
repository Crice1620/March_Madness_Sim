name: MBB Train

on:
  schedule:
    # June 1 each year, after the title game and hoopR's data lag
    - cron: "0 14 1 6 *"
  workflow_dispatch:
    inputs:
      first_season:
        description: "First training season (ending year)"
        default: "2005"
      last_season:
        description: "Last training season (blank = most recent completed)"
        default: ""

permissions:
  contents: write

concurrency:
  group: mbb-data
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::xgboost, any::dplyr, any::readr, any::jsonlite, any::Matrix, any::glmnet, any::hoopR, any::tidyr
          cache-version: 1

      # Refit the stint RAPM for the season that just finished (it becomes next season's prior)
      - name: Current season
        id: season
        run: echo "s=$(date -u +%Y)" >> "$GITHUB_OUTPUT"

      - name: Build Stint RAPM
        run: Rscript mbb_rapm_stint.R ${{ steps.season.outputs.s }} ${{ steps.season.outputs.s }}

      - name: Train model
        run: Rscript mbb_train.R ${{ inputs.first_season }} ${{ inputs.last_season }}

      - name: Commit model and RAPM
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb_model data/mbb/*/player_rapm.csv.gz
          git diff --cached --quiet || git commit -m "MBB model retrain and RAPM update $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
