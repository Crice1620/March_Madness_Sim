name: MBB Daily

on:
  schedule:
    # 12:00 UTC daily, only during the season (Nov-Apr). Manual runs work any time.
    - cron: "0 12 * 11-12,1-4 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mbb-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::hoopR, any::dplyr, any::tidyr, any::readr, any::zoo, any::httr, any::jsonlite, any::Matrix, any::glmnet
          cache-version: 1

      # 1. Update player RAPM metrics first based on recent box scores
      - name: Build Player RAPM
        run: Rscript mbb_rapm.R

      # 2. Rebuild current season backfill incorporating the new roster RAPMs
      - name: Rebuild current season
        run: Rscript mbb_backfill.R

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb
          git diff --cached --quiet || git commit -m "MBB daily update with RAPM $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
