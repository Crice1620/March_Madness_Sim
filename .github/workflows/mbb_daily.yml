name: MBB Daily

on:
  schedule:
    # 12:00 UTC daily, only during the season (Nov-Apr). Manual runs work any time.
    - cron: "0 12 * 11-12,1-4 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mbb-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::hoopR, any::dplyr, any::tidyr, any::readr, any::zoo, any::httr, any::jsonlite, any::Matrix, any::glmnet, any::kohonen
          cache-version: 1

      # Season = ending year (Nov-Dec belong to the NEXT calendar year's season)
      - name: Current season
        id: season
        run: |
          y=$(date -u +%Y); m=$((10#$(date -u +%m)))
          if [ "$m" -ge 11 ]; then echo "s=$((y+1))" >> "$GITHUB_OUTPUT"; else echo "s=$y" >> "$GITHUB_OUTPUT"; fi

      # 1. Box-score ridge RAPM, current season: the MODEL's roster feature (exists for every season)
      - name: Build Player RAPM (box-score, for the model)
        run: Rscript mbb_rapm.R ${{ steps.season.outputs.s }} ${{ steps.season.outputs.s }}

      # 1b. Stint RAPM from play-by-play substitutions, current season: what the APP shows.
      #     Writes player_rapm_stint.csv.gz; skips quietly if too few games reconstruct.
      - name: Build Stint RAPM (for the app)
        run: Rscript mbb_rapm_stint.R ${{ steps.season.outputs.s }} ${{ steps.season.outputs.s }}

      # 2. Rebuild current season features (reads the RAPM above)
      - name: Rebuild current season
        run: Rscript mbb_backfill.R

      # 3. Export the small files the Shiny app downloads
      - name: Export app data
        run: Rscript mbb_app_data.R

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb data/mbb_app
          git diff --cached --quiet || git commit -m "MBB daily update $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
